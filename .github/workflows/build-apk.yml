name: Build Android APK

# 云端构建 APK：
#   - 本地无需安装 JDK / Android SDK，零环境依赖
#   - 推送 tag（如 v1.3.1）即自动出包并附到 Release
#   - 也可手动触发（workflow_dispatch）出测试包

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建类型'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          # 必须用 17：本项目 Gradle 8.2.1 + AGP 8.2.1，Gradle 8.2 不支持 JDK 21
          # （Gradle 8.5 才正式支持 JDK 21）。用 21 会构建失败。
          java-version: '17'

        - name: 配置 Android SDK
        id: android_sdk
        continue-on-error: true
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'


      - name: 安装依赖
        run: npm ci

      - name: 构建前端
        run: npm run build

      - name: 同步到 Android 工程
        run: npx cap sync android

      - name: 注入签名配置
        if: github.event.inputs.build_type == 'release' || startsWith(github.ref, 'refs/tags/')
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::缺少 KEYSTORE_BASE64 secret，无法构建 release 包"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore

      - name: 构建 Release APK
        if: github.event.inputs.build_type == 'release' || startsWith(github.ref, 'refs/tags/')
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: 构建 Debug APK
        if: github.event.inputs.build_type == 'debug' || github.event_name == 'workflow_dispatch' && github.event.inputs.build_type != 'release'
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 收集产物
        run: |
          mkdir -p artifacts
          find android/app/build/outputs/apk -name "*.apk" -exec cp {} artifacts/ \;
          ls -lh artifacts/

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: bookkeeping-apk
          path: artifacts/*.apk
          retention-days: 90

      - name: 发布到 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.apk
          generate_release_notes: true
