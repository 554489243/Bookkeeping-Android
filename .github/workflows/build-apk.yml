name: Build Android APK

# 云端构建 APK：
#   - 本地无需安装 JDK / Android SDK，零环境依赖
#   - 推送 tag（如 v1.3.1）即自动出包并附到 Release
#   - 也可手动触发（workflow_dispatch）出测试包

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建类型'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          # 必须用 17：本项目 Gradle 8.2.1 + AGP 8.2.1，Gradle 8.2 不支持 JDK 21
          # （Gradle 8.5 才正式支持 JDK 21）。用 21 会构建失败。
          java-version: '17'

      - name: 配置 Android SDK
        id: android_sdk
        continue-on-error: true
        uses: android-actions/setup-android@v3
        with:
          # 关键：不接受它默认的包列表。
          # v3 默认会装一个叫 'tools' 的包，但该包已从 Google 仓库下架，
          # 导致 "Failed to find package 'tools'" + exit code 1，整个 Action 挂掉。
          # 只装构建真正需要的组件（runner 镜像里通常已预装，这里是幂等的兜底）。
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      # 该 Action 偶发失败（上游维护滞后、runner 镜像变动等），但 GitHub 的
      # ubuntu-latest 镜像本身就预装了 Android SDK。所以这里做一次兜底探测：
      # 只要能找到 SDK 与 sdkmanager，就继续构建；真找不到才报错停下。
      - name: 兜底检查 Android SDK 可用性
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/Android/Sdk}}"
          echo "探测到 SDK 路径: $SDK"
          if [ ! -d "$SDK" ]; then
            echo "::error::找不到 Android SDK 目录"
            exit 1
          fi
          ls "$SDK" || true
          # 关键组件：platforms/android-34 与 build-tools 必须存在
          if [ ! -d "$SDK/platforms/android-34" ]; then
            echo "::error::缺少 platforms;android-34"
            exit 1
          fi
          if [ ! -d "$SDK/build-tools/34.0.0" ]; then
            echo "::error::缺少 build-tools;34.0.0"
            exit 1
          fi
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          # 告诉 Gradle SDK 在哪（否则可能报 "SDK location not found"）
          echo "sdk.dir=$SDK" > android/local.properties
          echo "✅ Android SDK 可用"

      - name: 安装依赖
        run: npm ci

      - name: 环境信息（排障用）
        run: |
          echo "=== Java ==="
          java -version 2>&1 || true
          echo "=== Android SDK ==="
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "=== local.properties ==="
          cat android/local.properties 2>/dev/null || echo "(不存在)"

      - name: 构建前端
        run: npm run build

      - name: 同步到 Android 工程
        run: npx cap sync android

      # cap sync 有可能改写 local.properties，这里再确认一次 SDK 路径没丢
      - name: 校正 SDK 路径
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          if [ -d "$SDK" ]; then
            echo "sdk.dir=$SDK" > android/local.properties
            echo "已写入: $(cat android/local.properties)"
          else
            echo "::error::SDK 路径丢失"
            exit 1
          fi

      - name: 注入签名配置
        if: ${{ startsWith(github.ref, 'refs/tags/') || github.event.inputs.build_type == 'release' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::缺少 KEYSTORE_BASE64 secret，无法构建 release 包"
            echo "::error::请到 Settings → Secrets and variables → Actions 添加 4 个 secrets"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          ls -la android/app/release.keystore

      - name: 构建 Release APK
        if: ${{ startsWith(github.ref, 'refs/tags/') || github.event.inputs.build_type == 'release' }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: 构建 Debug APK
        # 注意加括号：&& 优先级高于 ||，不括号会导致选 release 时 debug 也一起跑
        if: ${{ !startsWith(github.ref, 'refs/tags/') && github.event.inputs.build_type == 'debug' }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 收集产物
        run: |
          mkdir -p artifacts
          find android/app/build/outputs/apk -name "*.apk" -exec cp {} artifacts/ \;
          ls -lh artifacts/

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: bookkeeping-apk
          path: artifacts/*.apk
          retention-days: 90

      - name: 发布到 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.apk
          generate_release_notes: true
